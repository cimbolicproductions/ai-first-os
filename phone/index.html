<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0b0d">
<title>AI-first OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<style>
  :root { --bg:#0b0b0d; --text:#f5f5f7; --muted:#98989f; --line:#2c2c2e; --card:#1c1c1e; --go:#34c759; }
  @media (prefers-color-scheme: light) { :root { --bg:#fbfbfd; --text:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; --card:#fff; } }
  * { box-sizing:border-box; margin:0; }
  [hidden] { display:none !important; }
  body { background:var(--bg); color:var(--text); font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px); max-width:560px; margin:0 auto; }
  #home { font-size:14px; color:var(--muted); display:flex; align-items:center; gap:8px; margin-bottom:28px; }
  #dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none; }
  #dot.on { background:var(--go); }
  textarea { width:100%; min-height:120px; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:14px; padding:14px; font:inherit; resize:none; }
  textarea:focus { outline:2px solid var(--text); outline-offset:1px; }
  button { font:inherit; font-weight:600; border:0; border-radius:12px; padding:13px 18px; background:var(--text); color:var(--bg); cursor:pointer; }
  button.soft { background:var(--card); color:var(--text); border:1px solid var(--line); }
  button:disabled { opacity:.4; }
  #send { width:100%; margin-top:10px; }
  #taskActions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  #taskActions button { flex:1 1 auto; padding:10px 12px; font-size:15px; }
  #sheetHint { color:var(--muted); font-size:14px; margin-top:8px; }
  #sheetRows { list-style:none; }
  #sheetRows li { display:flex; align-items:flex-start; gap:10px; justify-content:space-between; }
  #sheetRows button { flex:none; padding:7px 11px; font-size:14px; }
  .task-meta { color:var(--muted); font-size:14px; margin-top:4px; }
  #editTask label { display:block; margin:10px 0 5px; }
  #editTask textarea { min-height:88px; }
  #editTask select { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; }
  #msg { min-height:22px; color:var(--muted); font-size:15px; margin:10px 0 0; }
  h2 { font-size:13px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:32px 0 10px; }
  .note-open { margin-top:10px; }
  .notice .note-box { min-height:64px; margin:10px 0 8px; background:var(--bg, transparent); }
  .notice { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; overflow-wrap:anywhere; }
  .sign-in { display:block; text-align:center; margin-top:12px; padding:13px 18px; border-radius:12px; background:var(--text); color:var(--bg); font-weight:600; text-decoration:none; }
  .choices { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .choices button { flex:1 1 40%; }
  #today { color:var(--muted); }
  #alerts { width:100%; margin-top:24px; }
  #nolink { margin:30vh 0; text-align:center; color:var(--muted); }
  .hide-label { position:absolute; left:-9999px; }
  #boot { min-height:75vh; display:flex; align-items:center; justify-content:center; }
  #boot img { width:112px; height:112px; border-radius:26px; display:block; }
  #brand { width:24px; height:24px; border-radius:6px; flex:none; margin-right:4px; }
</style>
</head>
<body>
<div id="boot" role="status" aria-label="Loading" hidden>
  <picture>
    <source srcset="logo.png" media="(prefers-reduced-motion: reduce)">
    <img src="loading.gif" alt="">
  </picture>
</div>
<p id="nolink" hidden>Open your personal link to use this page.</p>
<main id="app" hidden>
  <div id="home"><img id="brand" src="logo.png" alt="AI-first OS"><span id="dot"></span><span id="homeText">Checking your computer…</span></div>
  <label class="hide-label" for="ask">What do you need?</label>
  <textarea id="ask" placeholder="What do you need?" maxlength="4000"></textarea>
  <div id="taskActions">
    <button type="button" id="voice" class="soft" aria-pressed="false">Voice dump</button>
    <button type="button" id="saveTasks" class="soft" hidden>Save to sheet</button>
    <button type="button" id="viewTasks" class="soft" hidden>Sheet tasks</button>
  </div>
  <button id="send">Send</button>
  <p id="msg" role="status"></p>
  <section id="sheetWrap" hidden>
    <h2>Your task sheet</h2>
    <p id="sheetHint"></p>
    <button type="button" id="addMore" class="soft" hidden>Add tasks</button>
    <ul id="sheetRows"></ul>
    <form id="editTask" class="notice" hidden>
      <strong id="editHeading">Update task</strong>
      <label for="editTitle">Task</label>
      <textarea id="editTitle" maxlength="500" required></textarea>
      <label for="editStatus">Status</label>
      <select id="editStatus">
        <option>Open</option><option>In progress</option><option>Waiting on Dom</option><option>Done</option>
      </select>
      <div class="choices">
        <button type="submit" id="updateTask">Save changes</button>
        <button type="button" id="cancelEdit" class="soft">Cancel</button>
      </div>
    </form>
  </section>
  <section id="waitingWrap" hidden><h2>Waiting on you</h2><div id="waiting"></div></section>
  <section id="updatesWrap" hidden><h2>Updates</h2><div id="updates"></div></section>
  <h2>Today</h2>
  <p id="today">Nothing yet.</p>
  <button id="alerts" class="soft" hidden>Turn on alerts</button>
</main>
<script>
(() => {
  function read(key) { try { return localStorage.getItem(key); } catch { return null; } }
  function write(key, value) { try { localStorage.setItem(key, value); } catch {} }

  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get("k")) {
    write("aios-link", location.hash.slice(1));
    history.replaceState(null, "", location.pathname);
  }
  const saved = hash.get("k") ? hash : new URLSearchParams(read("aios-link") || "");
  const backend = saved.get("b");
  const token = saved.get("k");
  const $ = id => document.getElementById(id);
  if (!backend || !token) { $("nolink").hidden = false; return; }
  $("boot").hidden = false;

  let vapidKey = null;
  let sending = false;
  let lastAsks = "";
  let lastInfo = "";
  const answered = new Set();
  const pendingKey = "aios-sheet-request:" + backend;
  let sheetAvailable = false;
  let sheetBusy = false;
  let sheetPolling = false;
  let retrySheet = null;
  let pendingSheet = null;
  let sheetRows = [];
  let editing = null;
  let recognition = null;
  try {
    const savedRequest = JSON.parse(read(pendingKey) || "null");
    if (/^[0-9a-f]{32}$/.test(savedRequest?.requestId || "") &&
        ["list", "add", "update"].includes(savedRequest.action)) pendingSheet = savedRequest;
  } catch {}

  async function call(method, route, body) {
    const res = await fetch(backend.replace(/\/$/, "") + "/v1/" + route, {
      method,
      headers: { authorization: "Bearer " + token, "content-type": "application/json" },
      ...(body ? { body: JSON.stringify(body) } : {}),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) {
      throw Object.assign(new Error(data.message || "Could not reach your OS."), { code: data.code });
    }
    return data;
  }

  function say(text) { $("msg").textContent = text; }

  function newSheetRequestId() {
    return Array.from(crypto.getRandomValues(new Uint8Array(16)), value => value.toString(16).padStart(2, "0")).join("");
  }

  function sheetButtons() {
    const busy = sheetBusy || Boolean(pendingSheet);
    $("saveTasks").hidden = $("viewTasks").hidden = !sheetAvailable;
    $("saveTasks").disabled = busy || Boolean(recognition);
    $("viewTasks").disabled = $("updateTask").disabled = busy;
  }

  function showSheetRows(message) {
    $("sheetWrap").hidden = false;
    $("sheetHint").textContent = message;
    $("addMore").hidden = sheetRows.length > 0;
    $("sheetRows").replaceChildren(...sheetRows.map(task => {
      const item = document.createElement("li");
      item.className = "notice";
      const info = document.createElement("div");
      const title = document.createElement("strong");
      title.textContent = task.id + " · " + task.task;
      const meta = document.createElement("p");
      meta.className = "task-meta";
      meta.textContent = [task.status, task.to].filter(Boolean).join(" · ");
      const edit = document.createElement("button");
      edit.type = "button";
      edit.className = "soft";
      edit.textContent = "Edit";
      edit.setAttribute("aria-label", "Edit " + task.id);
      edit.onclick = () => {
        if (pendingSheet || sheetBusy) return;
        editing = task;
        $("editHeading").textContent = "Update " + task.id;
        $("editTitle").value = task.task;
        $("editStatus").value = task.status;
        $("editTask").hidden = false;
        $("editTitle").focus();
      };
      info.append(title, meta);
      item.append(info, edit);
      return item;
    }));
  }

  async function pollSheet(online) {
    const pending = pendingSheet;
    if (!pending || sheetPolling) return;
    sheetPolling = true;
    try {
      const result = await call("POST", "sheetstatus", { requestId: pending.requestId });
      if (result.state === "queued") {
        say(online ? "Waiting for your task sheet…" : "Queued. Your computer will save it when it comes online.");
        return;
      }
      const receipt = result.receipt;
      if (result.state !== "finished" || receipt?.requestId !== pending.requestId ||
          receipt.action !== pending.action || typeof receipt.success !== "boolean") {
        throw new Error("Waiting for confirmation from your task sheet.");
      }
      pendingSheet = null;
      retrySheet = null;
      write(pendingKey, "");
      say(receipt.message);
      if (!receipt.success) return;
      if (receipt.action === "list") {
        sheetRows = receipt.tasks || [];
        editing = null;
        $("editTask").hidden = true;
        showSheetRows(receipt.message);
        if (pending.draft && $("ask").value === pending.draft) $("ask").value = "";
        $("sheetWrap").scrollIntoView({ block: "nearest" });
      } else if (receipt.action === "add") {
        if (pending.draft && $("ask").value === pending.draft) $("ask").value = "";
        $("ask").focus();
      } else {
        const changed = receipt.tasks?.[0];
        if (changed) {
          sheetRows = sheetRows.flatMap(row => row.id !== changed.id ? [row] : changed.status === "Done" ? [] : [changed]);
          showSheetRows(sheetRows.length ? "Open tasks" : "None currently. Did you want to add tasks?");
        }
        editing = null;
        $("editTask").hidden = true;
      }
    } catch (err) {
      if (err.code === "SHEET_REQUEST_MISSING") {
        pendingSheet = null;
        write(pendingKey, "");
      }
      say(err.message);
    } finally {
      sheetPolling = false;
      sheetButtons();
    }
  }

  async function submitSheet(action, payload = {}, draft = "") {
    if (sheetBusy || pendingSheet) return;
    if (!sheetAvailable) {
      say("Connect your task sheet on the computer to use this here.");
      return;
    }
    const signature = JSON.stringify({ action, ...payload });
    if (retrySheet?.signature !== signature) {
      retrySheet = { signature, operation: { requestId: newSheetRequestId(), action, ...payload } };
    }
    const operation = retrySheet.operation;
    sheetBusy = true;
    sheetButtons();
    say("Sending to your computer…");
    try {
      const queued = await call("POST", "sheet", operation);
      if (queued.requestId !== operation.requestId) throw new Error("Could not confirm that the task was queued.");
      pendingSheet = { requestId: operation.requestId, action, draft };
      write(pendingKey, JSON.stringify({ requestId: operation.requestId, action }));
      say("Queued for your computer.");
      await refresh();
    } catch (err) {
      say(err.message);
    } finally {
      sheetBusy = false;
      sheetButtons();
    }
  }

  function isSheetQuestion(text) {
    return /^(?:what tasks (?:are at hand|are open|are pending|are on my (?:task )?sheet)|what(?:['’]s| is) (?:at hand|open)|(?:show|list) (?:me )?(?:my |the )?(?:open )?tasks)(?: right now)?[?.!]*$/i.test(text);
  }

  $("saveTasks").onclick = () => {
    const draft = $("ask").value;
    const tasks = draft.split(/\r?\n/).map(task => task.trim()).filter(Boolean);
    if (!tasks.length) { say("Say or type a task first."); $("ask").focus(); return; }
    if (draft.length > 4000 || tasks.length > 20 || tasks.some(task => task.length > 500)) {
      say("Save up to 20 short tasks at a time."); return;
    }
    submitSheet("add", { tasks }, draft);
  };
  $("viewTasks").onclick = () => submitSheet("list");
  $("addMore").onclick = () => $("ask").focus();
  $("cancelEdit").onclick = () => { editing = null; $("editTask").hidden = true; };
  $("editTask").onsubmit = event => {
    event.preventDefault();
    if (!editing) return;
    const task = $("editTitle").value.trim();
    const status = $("editStatus").value;
    if (!task || !status) { say("Enter the task and its status."); return; }
    const patch = { ...(task !== editing.task ? { task } : {}), ...(status !== editing.status ? { status } : {}) };
    if (!Object.keys(patch).length) { say("Change the task or status first."); return; }
    submitSheet("update", { id: editing.id, revision: editing.revision, ...patch });
  };

  $("voice").onclick = () => {
    if (recognition) { recognition.stop(); return; }
    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Speech) {
      $("ask").focus();
      say("Tap the microphone on your keyboard and talk. Then tap Send.");
      return;
    }
    const draft = $("ask").value.trimEnd();
    const speech = new Speech();
    speech.lang = navigator.language;
    speech.continuous = true;
    speech.interimResults = true;
    let voiceError = false;
    speech.onstart = () => {
      $("voice").textContent = "Stop recording";
      $("voice").setAttribute("aria-pressed", "true");
      sheetButtons();
      say("Listening…");
    };
    speech.onresult = event => {
      const said = Array.from(event.results, result => result[0].transcript).join(" ").trim();
      const separated = said.replace(/[,.;]?\s*\bnext task\b[,:;.]?\s*/gi, "\n").trim();
      $("ask").value = [draft, separated].filter(Boolean).join("\n");
    };
    speech.onerror = () => {
      voiceError = true;
      say("Tap the microphone on your keyboard and talk, or type.");
    };
    speech.onend = () => {
      recognition = null;
      $("voice").textContent = "Voice dump";
      $("voice").setAttribute("aria-pressed", "false");
      sheetButtons();
      if (!voiceError) say("Tap Send.");
    };
    try { speech.start(); recognition = speech; sheetButtons(); }
    catch { $("ask").focus(); say("Tap the microphone on your keyboard and talk."); }
  };

  function signInLink(url) {
    try {
      const u = new URL(url);
      return u.protocol === "https:" && ["vercel.com", "github.com", "cli.github.com", "www.namecheap.com", "ap.www.namecheap.com", "claude.ai", "git-scm.com"].includes(u.hostname) ? u.href : null;
    } catch { return null; }
  }

  function noticeCard(n) {
    const card = document.createElement("div");
    card.className = "notice";
    const p = document.createElement("p");
    p.textContent = n.text;
    card.append(p);
    const link = signInLink(n.link);
    if (link) {
      const a = document.createElement("a");
      a.href = link;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.className = "sign-in";
      a.textContent = typeof n.linkLabel === "string" && n.linkLabel ? n.linkLabel.slice(0, 40) : "Open the sign-in page";
      card.append(a);
    }
    // An update about a piece of work can take a note for its next version.
    if (!(n.choices && n.choices.length) && n.kind === "done" && /^P[1-9][0-9]{0,6}$/.test(String(n.row || ""))) {
      const open = document.createElement("button");
      open.className = "soft note-open";
      open.textContent = "Add a note";
      open.onclick = () => {
        const box = document.createElement("textarea");
        box.className = "note-box";
        box.rows = 2;
        box.maxLength = 3900;
        box.placeholder = "What should change in the next version?";
        const send = document.createElement("button");
        send.textContent = "Send note";
        send.onclick = async () => {
          const words = box.value.trim();
          if (!words) return;
          send.disabled = true;
          try {
            await call("POST", "request", { text: "Note for " + n.row + ": " + words });
            box.remove();
            send.remove();
            say("Note sent.");
            refresh();
          } catch (err) {
            send.disabled = false;
            say(err.message);
          }
        };
        open.replaceWith(box, send);
        box.focus();
      };
      card.append(open);
    }
    if (n.choices && n.choices.length) {
      const row = document.createElement("div");
      row.className = "choices";
      n.choices.forEach((c, i) => {
        const b = document.createElement("button");
        b.textContent = c.label;
        if (i > 0) b.className = "soft";
        b.onclick = async () => {
          row.querySelectorAll("button").forEach(x => { x.disabled = true; });
          try {
            await call("POST", "answer", { noticeId: n.id, digest: n.digest, value: c.value });
            answered.add(n.id);
            card.remove();
            say("Got it.");
            refresh();
          } catch (err) {
            row.querySelectorAll("button").forEach(x => { x.disabled = false; });
            say(err.message);
          }
        };
        row.append(b);
      });
      card.append(row);
    }
    return card;
  }

  async function refresh() {
    try {
      const s = await call("GET", "status");
      sheetAvailable = s.sheetTasks === true;
      sheetButtons();
      $("dot").className = s.home.online ? "on" : "";
      $("homeText").textContent = s.home.online
        ? "Home computer online"
        : "Home computer offline" + (s.queued ? " · " + s.queued + " waiting for it" : " · requests will wait for it");
      const open = s.notices.filter(n => !answered.has(n.id));
      const asks = open.filter(n => n.choices && n.choices.length);
      const info = open.filter(n => !(n.choices && n.choices.length));
      $("waitingWrap").hidden = !asks.length;
      const askKey = asks.map(n => n.id).join();
      if (askKey !== lastAsks) { lastAsks = askKey; $("waiting").replaceChildren(...asks.map(noticeCard)); }
      $("updatesWrap").hidden = !info.length;
      // Left alone while a note is being written, so the box does not vanish mid-sentence.
      const infoKey = info.slice(-5).map(n => n.id).join();
      if (infoKey !== lastInfo && !document.querySelector(".note-box")) { lastInfo = infoKey; $("updates").replaceChildren(...info.slice(-5).reverse().map(noticeCard)); }
      $("today").textContent = s.summary ? s.summary.headline : "Nothing yet.";
      vapidKey = s.vapidKey;
      $("alerts").hidden = !vapidKey || !("PushManager" in window) || (window.Notification && Notification.permission === "granted");
      await pollSheet(s.home.online);
    } catch (err) {
      $("homeText").textContent = err.message;
    }
  }

  $("send").onclick = async () => {
    const text = $("ask").value.trim();
    if (!text || sending) return;
    if (isSheetQuestion(text)) {
      await submitSheet("list", {}, $("ask").value);
      return;
    }
    sending = true;
    $("send").disabled = true;
    try {
      await call("POST", "request", { text });
      $("ask").value = "";
      say("Sent.");
      refresh();
    } catch (err) {
      say(err.message);
    }
    sending = false;
    $("send").disabled = false;
  };

  $("alerts").onclick = async () => {
    try {
      const reg = await navigator.serviceWorker.register("sw.js");
      const raw = atob(vapidKey.replace(/-/g, "+").replace(/_/g, "/"));
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: Uint8Array.from(raw, c => c.charCodeAt(0)),
      });
      await call("POST", "subscribe", { endpoint: sub.endpoint });
      $("alerts").hidden = true;
      say("Alerts are on.");
    } catch {
      say("Alerts could not be turned on here. On iPhone, add this page to your Home Screen first.");
    }
  };

  sheetButtons();
  refresh().finally(() => { $("boot").hidden = true; $("app").hidden = false; });
  setInterval(refresh, 8000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
