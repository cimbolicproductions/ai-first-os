<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0b0d">
<title>AI-first OS</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --bg:#0b0b0d; --text:#f5f5f7; --muted:#98989f; --line:#2c2c2e; --card:#1c1c1e; --go:#34c759; }
  @media (prefers-color-scheme: light) { :root { --bg:#fbfbfd; --text:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; --card:#fff; } }
  * { box-sizing:border-box; margin:0; }
  [hidden] { display:none !important; }
  body { background:var(--bg); color:var(--text); font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px); max-width:560px; margin:0 auto; }
  #home { font-size:14px; color:var(--muted); display:flex; align-items:center; gap:8px; margin-bottom:28px; }
  #dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none; }
  #dot.on { background:var(--go); }
  textarea { width:100%; min-height:120px; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:14px; padding:14px; font:inherit; resize:none; }
  textarea:focus { outline:2px solid var(--text); outline-offset:1px; }
  button { font:inherit; font-weight:600; border:0; border-radius:12px; padding:13px 18px; background:var(--text); color:var(--bg); cursor:pointer; }
  button.soft { background:var(--card); color:var(--text); border:1px solid var(--line); }
  button:disabled { opacity:.4; }
  #send { width:100%; margin-top:10px; }
  #agents { display:flex; gap:8px; overflow-x:auto; margin-top:12px; padding-bottom:4px; }
  #agents button { flex:none; padding:7px 13px; font-size:14px; font-weight:500; background:var(--card); color:var(--text); border:1px solid var(--line); }
  #agents button.on { background:var(--text); color:var(--bg); }
  #msg { min-height:22px; color:var(--muted); font-size:15px; margin:10px 0 0; }
  h2 { font-size:13px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:32px 0 10px; }
  .notice { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; overflow-wrap:anywhere; }
  .choices { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .choices button { flex:1 1 40%; }
  #today { color:var(--muted); }
  #alerts { width:100%; margin-top:24px; }
  #nolink { margin:30vh 0; text-align:center; color:var(--muted); }
  .hide-label { position:absolute; left:-9999px; }
</style>
</head>
<body>
<p id="nolink" hidden>Open your personal link to use this page.</p>
<main id="app" hidden>
  <div id="home"><span id="dot"></span><span id="homeText">Checking your computer…</span></div>
  <label class="hide-label" for="ask">What do you need?</label>
  <textarea id="ask" placeholder="What do you need?"></textarea>
  <div id="agents"></div>
  <button id="send">Send</button>
  <p id="msg" role="status"></p>
  <section id="waitingWrap" hidden><h2>Waiting on you</h2><div id="waiting"></div></section>
  <section id="updatesWrap" hidden><h2>Updates</h2><div id="updates"></div></section>
  <h2>Today</h2>
  <p id="today">Nothing yet.</p>
  <button id="alerts" class="soft" hidden>Turn on alerts</button>
</main>
<script>
(() => {
  function read(key) { try { return localStorage.getItem(key); } catch { return null; } }
  function write(key, value) { try { localStorage.setItem(key, value); } catch {} }

  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get("k")) {
    write("aios-link", location.hash.slice(1));
    history.replaceState(null, "", location.pathname);
  }
  const saved = hash.get("k") ? hash : new URLSearchParams(read("aios-link") || "");
  const backend = saved.get("b");
  const token = saved.get("k");
  const $ = id => document.getElementById(id);
  if (!backend || !token) { $("nolink").hidden = false; return; }
  $("app").hidden = false;

  let target = null;
  let vapidKey = null;
  let sending = false;
  let lastAgents = "";
  const answered = new Set();

  async function call(method, route, body) {
    const res = await fetch(backend.replace(/\/$/, "") + "/v1/" + route, {
      method,
      headers: { authorization: "Bearer " + token, "content-type": "application/json" },
      ...(body ? { body: JSON.stringify(body) } : {}),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) throw new Error(data.message || "Could not reach your OS.");
    return data;
  }

  function say(text) { $("msg").textContent = text; }

  function noticeCard(n) {
    const card = document.createElement("div");
    card.className = "notice";
    const p = document.createElement("p");
    p.textContent = n.text;
    card.append(p);
    if (n.choices && n.choices.length) {
      const row = document.createElement("div");
      row.className = "choices";
      n.choices.forEach((c, i) => {
        const b = document.createElement("button");
        b.textContent = c.label;
        if (i > 0) b.className = "soft";
        b.onclick = async () => {
          row.querySelectorAll("button").forEach(x => { x.disabled = true; });
          try {
            await call("POST", "answer", { noticeId: n.id, digest: n.digest, value: c.value });
            answered.add(n.id);
            card.remove();
            say("Got it.");
            refresh();
          } catch (err) {
            row.querySelectorAll("button").forEach(x => { x.disabled = false; });
            say(err.message);
          }
        };
        row.append(b);
      });
      card.append(row);
    }
    return card;
  }

  function renderAgents(agents) {
    const wrap = $("agents");
    wrap.replaceChildren();
    if (agents.length < 2) return;
    [{ id: null, label: "Anyone" }, ...agents].forEach(a => {
      const b = document.createElement("button");
      b.textContent = a.label;
      b.className = a.id === target ? "on" : "";
      b.setAttribute("aria-pressed", String(a.id === target));
      b.onclick = () => { target = a.id; renderAgents(agents); };
      wrap.append(b);
    });
  }

  async function refresh() {
    try {
      const s = await call("GET", "status");
      $("dot").className = s.home.online ? "on" : "";
      $("homeText").textContent = s.home.online
        ? "Home computer online"
        : "Home computer offline" + (s.queued ? " · " + s.queued + " waiting for it" : " · requests will wait for it");
      const agentKey = JSON.stringify(s.agents || []);
      if (agentKey !== lastAgents) { lastAgents = agentKey; renderAgents(s.agents || []); }
      const open = s.notices.filter(n => !answered.has(n.id));
      const asks = open.filter(n => n.choices && n.choices.length);
      const info = open.filter(n => !(n.choices && n.choices.length));
      $("waitingWrap").hidden = !asks.length;
      if (!$("waiting").querySelector("button:disabled")) $("waiting").replaceChildren(...asks.map(noticeCard));
      $("updatesWrap").hidden = !info.length;
      $("updates").replaceChildren(...info.slice(-5).reverse().map(noticeCard));
      $("today").textContent = s.summary ? s.summary.headline : "Nothing yet.";
      vapidKey = s.vapidKey;
      $("alerts").hidden = !vapidKey || !("PushManager" in window) || (window.Notification && Notification.permission === "granted");
    } catch (err) {
      $("homeText").textContent = err.message;
    }
  }

  $("send").onclick = async () => {
    const text = $("ask").value.trim();
    if (!text || sending) return;
    sending = true;
    $("send").disabled = true;
    try {
      await call("POST", "request", { text, to: target });
      $("ask").value = "";
      say("Sent.");
      refresh();
    } catch (err) {
      say(err.message);
    }
    sending = false;
    $("send").disabled = false;
  };

  $("alerts").onclick = async () => {
    try {
      const reg = await navigator.serviceWorker.register("sw.js");
      const raw = atob(vapidKey.replace(/-/g, "+").replace(/_/g, "/"));
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: Uint8Array.from(raw, c => c.charCodeAt(0)),
      });
      await call("POST", "subscribe", { endpoint: sub.endpoint });
      $("alerts").hidden = true;
      say("Alerts are on.");
    } catch {
      say("Alerts could not be turned on here. On iPhone, add this page to your Home Screen first.");
    }
  };

  refresh();
  setInterval(refresh, 8000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
