# AI-first OS - Hyprland / Omarchy Keybindings & Tiling Rules
# Drop into ~/.config/hypr/hyprland.conf (or source from ~/.config/hypr/bindings.conf on Omarchy)

$mainMod = SUPER

# 1-Keystroke AI Workspaces & Shell
bind = $mainMod, SPACE, exec, node bin/aios.cjs desktop
bind = $mainMod, RETURN, exec, ghostty -e node bin/aios.cjs tui
bind = $mainMod, B, exec, ghostty -e node bin/aios.cjs tui

# 1-Keystroke Toggle AI Agent Lanes
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, exec, ghostty -e claude
bind = $mainMod, 3, exec, ghostty -e codex
bind = $mainMod, 4, exec, ghostty -e gemini
bind = $mainMod, 5, exec, agy

# 1-Keystroke Native Voice-to-Text & Easy Share
bind = $mainMod, V, exec, node bin/aios.cjs voice
bind = $mainMod, S, exec, node bin/aios.cjs share --to agy
bind = $mainMod SHIFT, S, exec, node bin/aios.cjs share --to claude
